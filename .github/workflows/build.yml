name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release exe
        run: cargo build --release

      - name: Upload raw exe
        uses: actions/upload-artifact@v4
        with:
          name: edit-windows-exe
          path: target/release/edit.exe

      - name: Build Windows installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: edit-windows-installer
          path: installer/Output/edit-setup-windows.exe

  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps for eframe/egui (glow/x11/wayland backends)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev \
            libssl-dev \
            libfontconfig1-dev \
            fuse

      - name: Build release binary
        run: cargo build --release

      # linuxdeploy wants the binary, .desktop file and a hicolor icon tree
      # laid out inside an AppDir; it reads the icon name straight out of
      # `Icon=` in the .desktop file (which is "edit"), so the file names
      # below have to line up with that.
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp target/release/edit AppDir/usr/bin/edit
          cp linux/edit.desktop AppDir/usr/share/applications/edit.desktop
          for size in 16 24 32 48 64 128 256 512; do
            mkdir -p "AppDir/usr/share/icons/hicolor/${size}x${size}/apps"
            cp "assets/hicolor/${size}x${size}/apps/edit.png" \
               "AppDir/usr/share/icons/hicolor/${size}x${size}/apps/edit.png"
          done

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          # GitHub Actions runners have no FUSE (needed to mount an
          # AppImage), so run linuxdeploy pre-extracted instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/edit \
            --desktop-file linux/edit.desktop \
            --icon-file assets/icon.png \
            --output appimage
          mv edit-*.AppImage edit-linux-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: edit-linux-appimage
          path: edit-linux-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with all build outputs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/edit-windows-exe/edit.exe
            artifacts/edit-windows-installer/edit-setup-windows.exe
            artifacts/edit-linux-appimage/edit-linux-x86_64.AppImage
