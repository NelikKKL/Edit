[package]
name = "edit"
version = "0.1.0"
edition = "2021"
description = "A fast, modern text editor (Notepad alternative)"
authors = ["edit"]
build = "build.rs"

[[bin]]
name = "edit"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.28"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"
ttf-parser = "0.20"
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
arboard = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Linux packaging is now an AppImage, built in CI straight from
# `linux/edit.desktop` + `assets/icon.png` via linuxdeploy — see
# `.github/workflows/build.yml`. No extra Cargo metadata is needed for it
# (unlike the old cargo-deb setup this replaces).
